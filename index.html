<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOAT AI</title><link rel="stylesheet" href="style.css"></head><body><header><h1>🚤 BOAT AI</h1><span>イン重視モード</span></header><main><section class="card"><h2>レース入力</h2><label>会場<select id="venue"></select></label><label>レース<input id="race" type="number" min="1" max="12" value="1"></label><label>1号艇 展示タイム<input id="exhibit" type="number" step=".01" value="6.70"></label><label>1号艇 ST予想<input id="st" type="number" step=".01" value=".15"></label><label>1号艇 モーター2連率(%)<input id="motor" type="number" value="38"></label><label>1号艇 1着オッズ<input id="odds" type="number" step=".1" value="1.8"></label><button id="judge">AI判定</button></section><section class="card"><h2>判定</h2><div id="badge">未判定</div><p>1着確率 <b id="prob">--%</b></p><p>期待値 <b id="ev">--%</b></p><p>イン強度 <b id="inside">--</b></p><h3>買い目候補</h3><div id="bets">判定後に表示</div><button id="save" disabled>記録する</button></section><section class="card"><h2>本日の運用結果</h2><div id="summary"></div><table><thead><tr><th>会場</th><th>R</th><th>判定</th><th>確率</th><th>期待値</th></tr></thead><tbody id="history"></tbody></table><button id="clear">記録を消す</button></section><section class="card note">予測支援用の試作版です。投票・購入は行いません。数値は簡易スコアによる参考値で、利益や的中を保証しません。</section></main><script src="app.js"></script></body></html>
